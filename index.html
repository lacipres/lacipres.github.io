<style>
:root{
  --sage:#8FA383; --sage-d:#5F7553; --ink:#3D3935; --muted:#7A726A;
  --bg:#F6F1E6; --card:#FFFDF8; --line:#E6DDCB; --chip:#EEF1E8; --accent:#5F7553;
  --tab-bg:#E9E2D2;
}
body.dulce{
  --bg:#EEF2F8; --card:#FFFFFF; --line:#D9E0EC; --chip:#F3E9EA; --accent:#8E6B70; --tab-bg:#DDE5F1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.55 "Jost",system-ui,sans-serif;transition:background .35s;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:28px 16px 10px}
.logo{width:132px;height:132px;display:block;margin:0 auto 12px;filter:drop-shadow(0 6px 14px rgba(70,80,60,.18))}
.tag{margin:0;font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tag b{font-weight:500;color:var(--sage-d)}
.switch{display:flex;gap:4px;background:var(--tab-bg);border-radius:999px;padding:4px;max-width:340px;margin:22px auto 6px}
.switch button{flex:1;border:0;background:transparent;font:500 .95rem "Jost",sans-serif;letter-spacing:.06em;color:var(--muted);padding:10px 0;border-radius:999px;cursor:pointer;transition:.25s}
.switch button[aria-selected=true]{background:var(--card);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}
nav.cats{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
nav.cats .wrap::-webkit-scrollbar{display:none}
nav.cats a{flex:none;text-decoration:none;font-size:.85rem;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);white-space:nowrap;color:var(--ink)}
nav.cats a.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:8px 0 110px}
section.cat{padding-top:30px}
h2{font:italic 600 2rem/1.1 "Cormorant Garamond",serif;color:var(--accent);margin:0 0 4px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;margin-top:14px;box-shadow:0 1px 2px rgba(60,50,40,.04)}
.card h3{font:600 1.35rem/1.2 "Cormorant Garamond",serif;margin:0 0 4px;color:var(--ink)}
.desc{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;padding:0;list-style:none}
.chips li{background:var(--chip);border-radius:10px;padding:4px 10px;font-size:.86rem;line-height:1.35}
.chips-label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 0 0}
.prices{margin:4px 0 0;padding:0;list-style:none;border-top:1px dashed var(--line)}
.prices li{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.prices li:last-child{border-bottom:0}
.prices .dots{flex:1;border-bottom:1px dotted #CFC6B6;transform:translateY(-4px);min-width:16px}
.prices .p{font-weight:500;white-space:nowrap;color:var(--accent);font-variant-numeric:tabular-nums}
.extra{font-size:.88rem;margin:8px 0 0;color:var(--sage-d)}
.extra::before{content:"✦ "}
.note{margin-top:14px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--card));font-size:.93rem;border-left:3px solid var(--accent)}
.how{counter-reset:s;list-style:none;padding:0;margin:14px 0 0}
.how li{counter-increment:s;position:relative;padding:12px 0 12px 46px;border-bottom:1px solid var(--line)}
.how li::before{content:counter(s);position:absolute;left:0;top:10px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 1.05rem "Cormorant Garamond",serif}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto 0;max-width:340px;background:var(--sage-d);color:#fff;text-decoration:none;font-weight:500;letter-spacing:.04em;padding:14px 20px;border-radius:999px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:9}
.fab svg,.cta svg{width:28px;height:28px;fill:#fff}
.cta svg{width:22px;height:22px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 16px 40px}
footer a{color:var(--accent);text-decoration:none;font-weight:500}
.status{text-align:center;color:var(--muted);padding:40px 0}
@media (min-width:640px){h2{font-size:2.3rem}.logo{width:150px;height:150px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

<script>
const WA_ICON = document.getElementById('fab').innerHTML;
const waLink = (msg) => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
document.getElementById('fab').href = waLink('¡Hola! Vi el catálogo de La Ciprés y quiero hacer un pedido 😊');
document.getElementById('ig').href = `https://instagram.com/${INSTAGRAM}`;

function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&text[i+1]=='\n')i++; row.push(f);rows.push(row);row=[];f='' }
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(v=>v.trim()!=='')).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
function price(v){
  const d=v.replace(/[^\d]/g,'');
  return d ? '$'+Number(d).toLocaleString('es-CL') : esc(v);
}
const isNo=v=>/^(no|n|false|0)$/i.test(v.trim());
const HOW='cómo comprar';

let DATA=[], current='Salado';

function render(){
  const items=DATA.filter(r=>r.catalogo.toLowerCase()===current.toLowerCase() && !isNo(r.disponible||''));
  const cats=[];const by={};
  items.forEach(r=>{const k=r.categoria||'Otros';if(!by[k]){by[k]=[];cats.push(k)}by[k].push(r)});
  // "Cómo comprar" siempre al final
  cats.sort((a,b)=>(a.toLowerCase()===HOW)-(b.toLowerCase()===HOW));
  document.getElementById('nav').innerHTML=cats.map(c=>`<a href="#${slug(current+'-'+c)}">${esc(c)}</a>`).join('');
  document.getElementById('menu').innerHTML = cats.length ? cats.map(c=>{
    const rows=by[c];
    let body;
    if(c.toLowerCase()===HOW){
      body=`<ol class="how">${rows.map(r=>`<li>${esc(r.descripcion||r.producto)}</li>`).join('')}</ol>
      <a class="cta" target="_blank" rel="noopener" href="${waLink('¡Hola! Quiero cotizar un pedido del catálogo '+current.toLowerCase()+'.')}">${WA_ICON}Cotizar por WhatsApp</a>`;
    } else body=rows.map(card).join('');
    return `<section class="cat" id="${slug(current+'-'+c)}"><h2>${esc(c)}</h2>${body}</section>`;
  }).join('') : '<p class="status">No hay productos disponibles en este momento.</p>';
  spy();
}
function card(r){
  const prices=[];
  for(let i=1;i<=6;i++){ const p=r['precio'+i]; if(p) prices.push([r['precio'+i+'_detalle']||'',p]); }
  const ops=(r.opciones||'').split(';').map(s=>s.trim()).filter(Boolean);
  if(!r.producto && !prices.length && !ops.length) return `<div class="note">${esc(r.descripcion)}</div>`;
  return `<article class="card">
    ${r.producto?`<h3>${esc(r.producto)}</h3>`:''}
    ${r.descripcion?`<p class="desc">${esc(r.descripcion)}</p>`:''}
    ${ops.length?`<p class="chips-label">Variedades</p><ul class="chips">${ops.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}
    ${prices.length?`<ul class="prices">${prices.map(([d,p])=>`<li><span>${esc(d)}</span><span class="dots"></span><span class="p">${price(p)}</span></li>`).join('')}</ul>`:''}
    ${r.nota?`<p class="extra">${esc(r.nota)}</p>`:''}
  </article>`;
}
function setCat(c,scroll){
  current=c;document.body.classList.toggle('dulce',c==='Dulce');
  document.querySelectorAll('.switch button').forEach(b=>b.setAttribute('aria-selected',b.dataset.cat===c));
  render(); if(scroll) window.scrollTo({top:0});
  try{ history.replaceState(null,'','#'+c.toLowerCase()); }catch(e){ /* vista previa: se ignora */ }
}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>setCat(b.dataset.cat,true));

let io;
function spy(){
  if(io) io.disconnect();
  const links=[...document.querySelectorAll('nav.cats a')];
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){
    links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));
    const on=links.find(a=>a.classList.contains('on')); const bar=document.getElementById('nav');
    if(on) bar.scrollTo({left:on.offsetLeft-bar.clientWidth/2+on.offsetWidth/2,behavior:'smooth'});
  }}),{rootMargin:'-120px 0px -65% 0px'});
  document.querySelectorAll('section.cat').forEach(s=>io.observe(s));
}

async function load(){
  let text=null;
  if(SHEET_CSV_URL.startsWith('http')){
    try{
      const url=SHEET_CSV_URL+(SHEET_CSV_URL.includes('?')?'&':'?')+'t='+Date.now();
      const res=await fetch(url,{cache:'no-store'});
      if(res.ok){ const t=await res.text(); if(/catalogo/i.test(t.split('\n')[0])) text=t; }
    }catch(e){ console.warn('No se pudo leer Google Sheets, uso respaldo',e); }
  }
  DATA=parseCSV(text||document.getElementById('respaldo').textContent);
  const start=location.hash.toLowerCase().startsWith('#dulce')?'Dulce':'Salado';
  setCat(start,false);
}
load();
</script>
